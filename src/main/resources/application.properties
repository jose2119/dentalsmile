spring.application.name=HappySmile

# ── DataSource ──────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://dpg-dbnrdvc9v7es73diaurg-a.oregon-postgres.render.com/db_dental_vku4}
spring.datasource.username=${DB_USERNAME:db_dental_vku4_user}
spring.datasource.password=${DB_PASSWORD:lzXACR4Hm8mM2gFqijqjZeM7IkS2TS41}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ─────────────────────────────────────────
# update: crea tablas nuevas (usuario) sin tocar las ya existentes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ── Servidor ─────────────────────────────────────────────────
server.port=${SERVER_PORT:8080}

# ── JWT ──────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:HappySmile2026-SecretKey-ChangeInProduction-MustBe32CharsOrMore!}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ── SpringDoc / Swagger ──────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true

# ── Jackson ──────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
